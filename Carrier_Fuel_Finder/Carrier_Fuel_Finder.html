<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font: 16px Arial;  
}

input {
  border: 1px solid transparent;
  background-color: #FFB300;
  font-size: 16px;
  color: #383838;
}

input[type=text] {
  background-color: #FFB300;
  width: 100%;
  padding: 10px;
}

input[type=button] {
  background-color: #FF9300;
  color: #383838;
  font-weight: bold;
  cursor: pointer;
  padding: 10px;
}

input[type=radio]{
	color: #FF9300;
}

.autocomplete-items {
  color: #fff;
  position: absolute;
  border: 1px solid #d4d4d4;
  border-bottom: none;
  border-top: none;
  z-index: 99;
  /*position the autocomplete items to be the same width as the container:*/
  top: 100%;
  left: 0;
  right: 0;
}

.autocomplete-items div {
  padding: 10px;
  cursor: pointer;
  background-color: rgba(0,0,0,0.7); 
  border-bottom: 1px solid #d4d4d4; 
}

/*when hovering an item:*/
.autocomplete-items div:hover {
  background-color: #fff; 
  color: rgba(0,0,0,0.7); 
}

/*when navigating through the items using the arrow keys:*/
.autocomplete-active {
  background-color: #FF9300 !important; 
  color: #383838; 
}

.dropbtn {
  background-color: #FF9300;
  color: #383838;
  padding: 16px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

.dropbtn:hover, .dropbtn:focus {
  background-color: #FF9300;
}

.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f1f1f1;
  min-width: 160px;
  width: 450px;
  overflow: auto;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: white;
  background-color: rgba(0,0,0,0.7);
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}
.dropdown a:hover {
	color: rgba(0,0,0,0.7);
	background-color: white;
}
table.tableizer-table {
	border: 1px solid #CCC; 
	font-size: 18px;
	color: #FF9300;
	vertical-align: center;

	background-color: rgba(0,0,0,0.7)
} 
.tableizer-table td {
	padding: 4px;
	margin: 3px;
	color: #FF9300;
	font-weight: bold;
	vertical-align: center;
	border: 1px solid #CCC;
}
.tableizer-table th {
	background-color: #FF9300; 
	color: #383838;
	font-weight: bold;
	font-size: 18px;
}
::placeholder {
  color: #383838;
}
.show {display: block;}
</style>
</head>
<body>
<div style="width: 100%!">
	<div style="vertical-align: top;padding-right:25px;display: inline-block;">
		<div class="autocomplete" style="width:250px;position: relative;">
				<input type="text" id="SystemNameInput" onkeyup="SystemNameAC()" placeholder="System name..." autocomplete="off">
				<div id="SystemNameInput-autocompleteList" class="autocomplete-items"></div>
		</div>
		<div style=height:10Px;"></div>
		<input type="number" id="SystemPosX" placeholder="X" autocomplete="off">
		<div style=height:10Px;"></div>
		<input type="number" id="SystemPosY" placeholder="Y" autocomplete="off">
		<div style=height:10Px;"></div>
		<input type="number" id="SystemPosZ" placeholder="Z" autocomplete="off">
	</div>
	<div style="vertical-align: top;display: inline-block;">
		<input id="SearchButton" type="button" value="Find Fuel" onclick="SearchClick()">
	</div>
	<div style="vertical-align: top;padding-top:25px">
		                <div id="DataStatusMessage" style="padding-bottom:10px;color:#FF9300;font-weight:bold;"></div>
                <Table class="tableizer-table" id="OverlapsTable" border="0">
                        <tr>
                                <th style="width: 350px">System Name</th>
                                <th style="width: 75px;">X</th>
                                <th style="width: 75px">Y</th>
                                <th style="width: 75px">Z</th>
                                <th style="width: 100px">Body</th>
                                <th style="width: 150px">Distance [LY]</th>
                        </tr>
                </Table>
	</div>
</div>
<script src="data/fuel_carriers.snapshot.js"></script>
<script>

        const DATA_FEED_VERSION = '2024-03-17';
        const DATA_FEED_URL = 'data/fuel_carriers.json?v=' + DATA_FEED_VERSION;
        const STATIC_SNAPSHOT = window.__CARRIER_FUEL_SNAPSHOT__ || { version: DATA_FEED_VERSION, data: [] };

        let carrierRecords = [];
        let dataLoadPromise = null;

        var input = document.getElementById("SystemNameInput");

        input.addEventListener("keyup", function(event) {
                // Number 13 is the "Enter" key on the keyboard
                if (event.keyCode === 13) {
                // Cancel the default action, if needed
                event.preventDefault();
                // Trigger the button element with a click
                document.getElementById("SearchButton").click();
                }
        });

        document.addEventListener('DOMContentLoaded', function() {
                ensureCarrierData().then(function() {
                        FilterData();
                });
        });

        function ensureCarrierData() {
                if (!dataLoadPromise) {
                        dataLoadPromise = loadCarrierData();
                }
                return dataLoadPromise;
        }

        function loadCarrierData() {
                var statusDiv = document.getElementById("DataStatusMessage");

                return fetch(DATA_FEED_URL, { cache: 'no-store' })
                        .then(function(response) {
                                if (!response.ok) {
                                        throw new Error('HTTP ' + response.status);
                                }
                                return response.json();
                        })
                        .then(function(payload) {
                                if (payload.version && payload.version !== DATA_FEED_VERSION) {
                                        statusDiv.innerText = 'Newer dataset version ' + payload.version + ' detected. Refresh your cache to stay current.';
                                } else {
                                        statusDiv.innerText = '';
                                }
                                carrierRecords = Array.isArray(payload.data) ? payload.data : [];
                                renderTable(carrierRecords);
                                return carrierRecords;
                        })
                        .catch(function(error) {
                                console.warn('Carrier fuel dataset fetch failed, falling back to snapshot.', error);
                                carrierRecords = Array.isArray(STATIC_SNAPSHOT.data) ? STATIC_SNAPSHOT.data : [];
                                statusDiv.innerText = '⚠️ Live carrier fuel dataset unavailable; using cached snapshot (version ' + (STATIC_SNAPSHOT.version || DATA_FEED_VERSION) + ').';
                                renderTable(carrierRecords);
                                return carrierRecords;
                        });
        }

        function renderTable(records) {
                var OverlapsTable = document.getElementById("OverlapsTable");
                while (OverlapsTable.rows.length > 1) {
                        OverlapsTable.deleteRow(1);
                }

                records.forEach(function(record) {
                        var row = OverlapsTable.insertRow(-1);
                        row.dataset.lastSeen = record.lastSeen || '';
                        row.dataset.reportedBy = record.reportedBy || '';
                        row.dataset.padSize = record.padSize || '';
                        row.dataset.services = (record.services || []).join(',');

                        row.insertCell(0).innerText = record.system;
                        row.insertCell(1).innerText = record.coordinates ? record.coordinates.x : '';
                        row.insertCell(2).innerText = record.coordinates ? record.coordinates.y : '';
                        row.insertCell(3).innerText = record.coordinates ? record.coordinates.z : '';
                        row.insertCell(4).innerText = record.body || '';
                        row.insertCell(5).innerText = record.distance !== undefined && record.distance !== null && !isNaN(record.distance)
                                ? record.distance.toFixed(2)
                                : '';
                });
        }

        function FilterData(){
                var SystemX = parseFloat(document.getElementById("SystemPosX").value);
                var SystemY = parseFloat(document.getElementById("SystemPosY").value);
                var SystemZ = parseFloat(document.getElementById("SystemPosZ").value);
                var hasSystemCoords = !isNaN(SystemX) && !isNaN(SystemY) && !isNaN(SystemZ);

                if (!carrierRecords.length) {
                        return;
                }

                var computed = carrierRecords.map(function(record) {
                        var distance = null;

                        if (hasSystemCoords && record.coordinates) {
                                var dx = parseFloat(record.coordinates.x) - SystemX;
                                var dy = parseFloat(record.coordinates.y) - SystemY;
                                var dz = parseFloat(record.coordinates.z) - SystemZ;

                                distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        }

                        return Object.assign({}, record, { distance: distance });
                });

                if (hasSystemCoords) {
                        computed.sort(function(a, b) {
                                var ad = (a.distance === null || isNaN(a.distance)) ? Number.POSITIVE_INFINITY : a.distance;
                                var bd = (b.distance === null || isNaN(b.distance)) ? Number.POSITIVE_INFINITY : b.distance;
                                return ad - bd;
                        });
                }

                renderTable(computed);
        }

        function SystemNameAC() {
                var filter, url;
                var input = document.getElementById("SystemNameInput");
                var xmlhttp = new XMLHttpRequest();
                var DivList = document.getElementById("SystemNameInput-autocompleteList");

                xmlhttp.onreadystatechange = function() {
                        var SystemNameArr, i;

                        DivList.innerHTML = '';

                        if (this.readyState === XMLHttpRequest.DONE && this.status == 200) {

                                SystemNameArr = JSON.parse(this.responseText)

                                for(i = 0; i < SystemNameArr.length && i < 10; i++) {
                                        b = document.createElement("DIV");
                                        b.innerHTML = "<strong>" + SystemNameArr[i].name.substr(0, filter.length) + "</strong>";
                                        b.innerHTML += SystemNameArr[i].name.substr(filter.length);
                                        b.innerHTML += "<input type='hidden' value='" + SystemNameArr[i].name + "'>";
                                        b.addEventListener("click", function(e) {
                                                input.value = this.getElementsByTagName("input")[0].value;
                                                DivList.innerHTML = '';
                                        });
                                        DivList.appendChild(b);
                                }
                        }
                };

                input = document.getElementById("SystemNameInput");
                filter = input.value.toUpperCase();

                if(filter.length >= 3){
                        url = 'https://www.edsm.net/api-v1/systems?systemName=' + encodeURIComponent(filter);

                        xmlhttp.open("GET", url, true);
                        xmlhttp.send();
                }else{
                        DivList.innerHTML = '';
                }
        }

        function SearchClick() {

                function ReadSystemData( callback ){

                        var xmlhttp = new XMLHttpRequest();
                        xmlhttp.onreadystatechange = function() {
                                if (this.readyState ==4 && this.status == 200) {
                                        var SystemName = document.getElementById("SystemNameInput").value;

                                        if(this.responseText == '[]'){
                                                alert('No system with name [' + SystemName + '] could be found!');
                                        }else{

                                                var JsonResponse;
                                                JsonResponse = JSON.parse(this.responseText);

                                                var SystemX = JsonResponse.coords.x;
                                                var SystemY = JsonResponse.coords.y;
                                                var SystemZ = JsonResponse.coords.z;

                                                document.getElementById("SystemPosX").value = SystemX;
                                                document.getElementById("SystemPosY").value = SystemY;
                                                document.getElementById("SystemPosZ").value = SystemZ;
                                        }
                                        callback(); // next step
                                }
                        };

                        var SystemName = document.getElementById("SystemNameInput").value;

                        if(SystemName != ''){
                                var url = 'https://www.edsm.net/api-v1/system?systemName=' +  encodeURIComponent(SystemName) + '&showCoordinates=1';

                                xmlhttp.open("GET", url, true);
                                xmlhttp.send();
                        }else{
                                callback();
                        };
                }

                ReadSystemData(function(){
                        ensureCarrierData().then(function(){
                                FilterData();
                        });
                });

        }
</script>
</body>
</html>
